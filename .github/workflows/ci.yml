name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and property tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --locked --release
      - name: Golden CLI tests
        run: golden/run.sh --strict-stderr target/release/ltext

  msrv:
    name: build (Rust 1.85, MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      # Build only: the test-only dependency proptest needs a newer Rust.
      - run: cargo build --locked

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Optional binary cache: set the repository variable CACHIX_CACHE to the
      # cache name and the secret CACHIX_AUTH_TOKEN to a token that can push.
      - name: Use Cachix cache
        if: vars.CACHIX_CACHE != ''
        run: |
          nix-env --quiet -iA cachix -f https://cachix.org/api/v1/install
          cachix use "${{ vars.CACHIX_CACHE }}"
      # The derivation also runs the unit, property and golden tests.
      - run: nix build --print-build-logs
      - name: Push to Cachix
        if: vars.CACHIX_CACHE != '' && github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "::warning::CACHIX_AUTH_TOKEN isn't set; not pushing"
          else
            cachix push "${{ vars.CACHIX_CACHE }}" ./result
          fi
