name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cabal:
    name: cabal / GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6', '9.8', '9.10', '9.12', '9.14']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --enable-tests --dry-run
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal build all --enable-tests
      - run: cabal test all

  stack:
    name: stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
      - uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: stack-${{ runner.os }}-
      - run: stack test
