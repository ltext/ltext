name: Release

# Pushing a tag vX.Y.Z builds ltext for every platform below and publishes a
# GitHub release with the archives, .deb/.rpm packages and SHA256SUMS. The
# annotated tag's message becomes the release notes.
#
# Pull requests that touch packaging run the same builds, without
# publishing, so a broken release is caught before tagging.
on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .cargo/config.toml
      - packaging/container/Dockerfile
      - build.rs
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl), so they run on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, linux-packages: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, linux-packages: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on Apple silicon, so its tests can't run there.
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # build.rs derives the version from `git describe`, which needs tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo_version=$(cargo pkgid | sed 's/.*[#@]//')
          if [[ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Locate binary and version
        run: |
          exe=target/${{ matrix.target }}/release/ltext
          [[ "${{ runner.os }}" == Windows ]] && exe+=.exe
          echo "EXE=$exe" >> "$GITHUB_ENV"
          if [[ "${{ matrix.cross }}" == true ]]; then
            version=$(cargo pkgid | sed 's/.*[#@]//')
            [[ "$GITHUB_REF" == refs/tags/* ]] || version=$(git describe --tags --match 'v[0-9]*' --always --dirty | sed 's/^v//')
          else
            version=$("$exe" --version | cut -d' ' -f2)
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::binary reports version $version, expected ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ltext $version"

      - name: Check the Windows binary needs no C runtime DLLs
        if: runner.os == 'Windows'
        run: |
          if grep -aiqE 'vcruntime[0-9]*\.dll|api-ms-win-crt-' "$EXE"; then
            echo "::error::$EXE links the C runtime dynamically"
            exit 1
          fi

      - name: Unit and property tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Golden CLI tests
        if: ${{ !matrix.cross }}
        run: golden/run.sh --strict-stderr "$EXE"

      - name: Archive
        run: |
          name=ltext-$VERSION-${{ matrix.target }}
          mkdir -p "dist" "$name"
          cp "$EXE" README.md LICENSE "$name/"
          if [[ "${{ runner.os }}" == Windows ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath 'dist/$name.zip'"
            # A bare .exe too, for dropping straight onto the PATH.
            cp "$EXE" "dist/$name.exe"
          else
            tar czf "dist/$name.tar.gz" "$name"
          fi

      - name: Debian and RPM packages
        if: matrix.linux-packages
        run: |
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - run: ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ltext-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the annotated tag's message minus its first (title) line.
          # (--notes-from-tag needs a local checkout, and this job has none.)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .message | tail -n +3 > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ltext ${GITHUB_REF_NAME#v}" --notes-file notes.md

  container:
    name: container image
    needs: [build, release]
    # Runs on PRs too (release is skipped there): build and smoke-test only.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ltext/ltext
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ltext-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Lay out the build context
        run: |
          set -euo pipefail
          mkdir -p ctx/amd64 ctx/arm64
          cp LICENSE ctx/
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*} triple=${pair#*:}-unknown-linux-musl
            tarball=$(ls dist/ltext-*-"$triple".tar.gz)
            tar xzf "$tarball" -C "ctx/$arch" --strip-components=1 --wildcards '*/ltext'
            version=$(basename "$tarball" "-$triple.tar.gz"); version=${version#ltext-}
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l ctx/*/
      - name: Smoke test (amd64)
        run: |
          docker build -q -t ltext-smoke --build-arg VERSION="$VERSION" -f packaging/container/Dockerfile ctx
          docker image ls ltext-smoke --format 'image size: {{.Size}}'
          test "$(docker run --rm ltext-smoke --version)" = "ltext $VERSION"
          printf '{{ name }}\nHello,\n{{ name }}\n' > greet && printf container > name
          test "$(docker run --rm -v "$PWD:/work" ltext-smoke 'greet name')" = "$(printf 'Hello,\ncontainer')"
      - name: Build both architectures, and push for releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$VERSION")
          push=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            tags+=(--tag "$IMAGE:${VERSION%.*}" --tag "$IMAGE:latest")
            push=(--push)
          fi
          docker buildx create --use >/dev/null
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" -f packaging/container/Dockerfile \
            "${tags[@]}" "${push[@]}" ctx
      - name: Check the pushed image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          test "$(docker run --rm "$IMAGE:$VERSION" --version)" = "ltext $VERSION"

  crates-io:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For crates.io trusted publishing: GitHub vouches for this workflow and
      # crates.io returns a token that lasts only for this publish. Configured
      # under the crate's settings on crates.io (ltext/ltext, release.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if this version is already on crates.io
        run: |
          version=${GITHUB_REF_NAME#v}
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "ltext-release (github.com/ltext/ltext)" \
            "https://crates.io/api/v1/crates/ltext/$version")
          if [[ "$status" == 200 ]]; then
            echo "ltext $version is already on crates.io"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Get a short-lived crates.io token
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -r .value)
          token=$(jq -n --arg jwt "$jwt" '{jwt: $jwt}' |
            curl -fsS -X POST https://crates.io/api/v1/trusted_publishing/tokens \
              -A "ltext-release (github.com/ltext/ltext)" \
              -H 'Content-Type: application/json' --data @- | jq -r .token)
          [[ -n "$token" && "$token" != null ]] || { echo "::error::no token from crates.io"; exit 1; }
          echo "::add-mask::$token"
          echo "CARGO_REGISTRY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Publish
        if: env.SKIP != 'true'
        run: cargo publish --locked
      - name: Revoke the token
        if: always() && env.CARGO_REGISTRY_TOKEN != ''
        run: >
          curl -fsS -X DELETE https://crates.io/api/v1/trusted_publishing/tokens
          -A "ltext-release (github.com/ltext/ltext)"
          -H "Authorization: Bearer $CARGO_REGISTRY_TOKEN"

  homebrew:
    name: Homebrew tap
    needs: release
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      # HOMEBREW_TAP_KEY: an SSH deploy key with write access to
      # ltext/homebrew-tap.
      - name: Check for the tap deploy key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::warning::HOMEBREW_TAP_KEY isn't set; not updating ltext/homebrew-tap"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'
        with:
          repository: ltext/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
      - name: Regenerate the formula
        if: env.SKIP != 'true'
        run: |
          bin/update-formula "$GITHUB_REF_NAME"
          if git diff --quiet; then
            echo "Formula already at ${GITHUB_REF_NAME#v}"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            git diff
            git -c user.name="Athan Clark" -c user.email="athan.clark@gmail.com" \
              commit -qam "ltext ${GITHUB_REF_NAME#v}"
          fi
      - name: Install, test and audit
        if: env.SKIP != 'true'
        run: |
          brew tap ltext/tap "$GITHUB_WORKSPACE"
          brew install ltext/tap/ltext
          brew test ltext/tap/ltext
          brew audit --strict --online ltext/tap/ltext
      - name: Push to the tap
        if: env.SKIP != 'true'
        run: git push origin HEAD:main

  aur:
    name: AUR
    needs: release
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  winget:
    name: winget
    needs: release
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
