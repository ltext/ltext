[package]
name = "ltext"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "λtext: general-purpose text-file templating utility"
license = "BSD-3-Clause"
repository = "https://github.com/ltext/ltext"
homepage = "https://ltext.github.io"
readme = "README.md"
authors = ["Athan Clark"]
categories = ["command-line-utilities", "template-engine"]
keywords = ["template", "templating", "text", "lambda-calculus", "cli"]
# The golden corpus is included so that packagers building from the crate can
# run golden/run.sh too.
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/build.rs",
  "/src/",
  "/tests/",
  "/benches/",
  "/golden/README.md",
  "/golden/run.sh",
  "/golden/cases/",
  "/golden/fixtures/",
  "/README.md",
  "/LICENSE",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
smallvec = "1"
unicode-general-category = "1.1.0"

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"

[[bench]]
name = "ltext"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1

# `cargo binstall ltext` downloads the release archives instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

# `cargo deb` (cargo-deb) and `cargo generate-rpm` (cargo-generate-rpm) build
# the Linux packages attached to GitHub releases; see .github/workflows/release.yml.
[package.metadata.deb]
maintainer = "Athan Clark <athan.clark@gmail.com>"
copyright = "2014-2026, Athan Clark"
license-file = ["LICENSE", "0"]
section = "text"
priority = "optional"
extended-description = """\
λtext is a templating tool for any text file. It treats files as functions:
a file whose first line is a header like {{ x y }} is a function of x and y,
and an expression on the command line applies files to other files. A
Hindley-Milner type checker catches mistakes before anything is rendered."""
assets = [
  ["target/release/ltext", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/ltext/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "General-purpose text-file templating utility"
assets = [
  { source = "target/release/ltext", dest = "/usr/bin/ltext", mode = "755" },
  { source = "LICENSE", dest = "/usr/share/licenses/ltext/LICENSE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/ltext/README.md", mode = "644", doc = true },
]
